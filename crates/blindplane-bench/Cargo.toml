[package]
name = "blindplane-bench"
description = "Benchmark harness comparing Blindplane's cryptographic core against established implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "blindplane-bench"
path = "src/main.rs"

[dependencies]
blindplane-core = { path = "../blindplane-core", version = "0.1.0" }
blindplane-crypto = { path = "../blindplane-crypto", version = "0.1.0" }
blindplane-wire = { path = "../blindplane-wire", version = "0.1.0" }

# Competitors. This crate is never published and nothing depends on it.
aes-gcm = "0.11.0"
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom", "hkdfsha2"] }
ring = "0.17.14"
sha2 = "0.11.0"
x25519-dalek = "3.0.0"

[lints]
workspace = true
